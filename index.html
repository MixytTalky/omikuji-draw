  <header>
    <div class="ad-slot ad-slot--header" data-ad-slot="header" aria-label="Advertisement"></div>
  </header>

  <div class="tool-layout">
    <main class="tool-content">
      <div id="screen-draw" class="screen active">
        <div class="header-titles">
          <svg class="shrine-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h16M4 14h16M6 8v12M18 8v12M12 4v4M12 14v6M10 4h4"/>
          </svg>
          <h1 class="main-title serif-text">日式手繪御神籤</h1>
          <p class="subtitle serif-text">放空思緒，在下方畫出你的意念</p>
        </div>
        
        <div class="canvas-container">
          <canvas id="paintCanvas"></canvas>
          <div class="canvas-overlay" id="canvas-overlay">請在此處繪製符號以注入意念</div>
        </div>
        
        <div class="action-buttons">
          <button id="btn-clear" class="btn btn-secondary">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
            </svg> 清除重畫
          </button>
          <button id="btn-draw-lot" class="btn btn-primary" disabled>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>
            </svg> 求取命籤
          </button>
        </div>
      </div>

      <div id="screen-result" class="screen">
        <div class="result-card">
          <div class="result-image-wrapper">
            <img id="result-image" class="result-image" src="" alt="御神籤結果圖" />
          </div>
          <h2 id="result-rank" class="result-rank serif-text"></h2>
          <p id="result-poem" class="result-poem serif-text"></p>
        </div>
        
        <div class="action-buttons">
          <button id="btn-retry" class="btn btn-secondary">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg> 再抽一次
          </button>
          <button id="btn-share" class="btn btn-primary">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
